      - { name: Install dependencies, run: npm ci }
      - { name: Build native DDS baseline, run: ./scripts/build-windows-dds.ps1 }
      - { name: Smoke native DDS baseline, run: 'npm run test:dds:smoke' }
      - name: Derive trusted segment identity
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: node scripts/remote-dds-ci-identity.mjs --derive --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --github-env "$env:GITHUB_ENV" --identity-out "$env:RUNNER_TEMP\remote-dds-trusted-identity.json"
      - name: Download deployment identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        env: { DDS_REMOTE_TEST_KEY: '' }
        with: { name: 'remote-dds-identity-${{ github.run_id }}-${{ github.run_attempt }}', path: identity }
      - name: Download deployment record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        env: { DDS_REMOTE_TEST_KEY: '' }
        with: { name: 'remote-dds-deployment-${{ github.run_id }}-${{ github.run_attempt }}', path: deployment }
      - name: Download predecessor state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        env: { DDS_REMOTE_TEST_KEY: '' }
        with: { name: 'remote-dds-state-${{ github.run_id }}-${{ github.run_attempt }}-0', path: state-0 }
      - name: Validate state-0 for segment 1
        env: { DDS_REMOTE_TEST_KEY: '' }
        run: node scripts/remote-dds-ci-state.mjs --validate-input --trusted-identity "$env:RUNNER_TEMP\remote-dds-trusted-identity.json" --identity "identity\predeployment-identity.json" --deployment "deployment\deployment.json" --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --state "state-0" --segment 1
      - name: Run remote DDS segment 1
        id: runner
        continue-on-error: true
        run: |
          $deployment = Get-Content -Raw "deployment\deployment.json" | ConvertFrom-Json
          node scripts/remote-worker-dds-soak.mjs --url "$($deployment.endpoint)" --run-dir "segment-run" --deployment-manifest "deployment\deployment.json" --max-new-operations 6000 --deadline-ms 17100000
      - name: Finalize state-1
        if: '${{ always() }}'
        env: { DDS_REMOTE_TEST_KEY: '' }
        run: node scripts/remote-dds-ci-state.mjs --finalize --trusted-identity "$env:RUNNER_TEMP\remote-dds-trusted-identity.json" --identity "identity\predeployment-identity.json" --deployment "deployment\deployment.json" --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --state-in "state-0" --run-dir "segment-run" --segment 1 --out "state-1"
      - name: Upload state-1
        if: '${{ always() }}'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env: { DDS_REMOTE_TEST_KEY: '' }
        with: { name: 'remote-dds-state-${{ github.run_id }}-${{ github.run_attempt }}-1', path: state-1, if-no-files-found: error, retention-days: 7 }
      - name: Re-propagate segment 1 failure
        if: "${{ always() && steps.runner.outcome == 'failure' }}"
        env: { DDS_REMOTE_TEST_KEY: '' }
        run: throw 'Remote DDS segment 1 failed after state publication.'


name: Remote DDS Soak
run-name: 'Remote DDS Soak ${{ inputs.request_id }}'

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request identifier
        required: true
        type: string

concurrency:
  group: stepstone-remote-dds-soak
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { submodules: recursive }
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native DDS baseline
        run: ./scripts/build-windows-dds.ps1
      - name: Smoke native DDS baseline
        run: npm run test:dds:smoke
      - name: Run application tests
        run: npm test
      - name: Run Worker tests
        run: npm run test:workers
      - name: Derive trusted prepare identity
        env:
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
        run: node scripts/remote-dds-ci-identity.mjs --derive --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --github-env "$env:GITHUB_ENV" --identity-out "$env:RUNNER_TEMP\remote-dds-trusted-identity.json"
      - name: Preflight temporary Worker identity
        env:
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
          DDS_REMOTE_TEST_KEY: ''
        run: |
          New-Item -ItemType Directory -Force identity | Out-Null
          node scripts/prepare-remote-dds-deployment.mjs --preflight --identity "$env:RUNNER_TEMP\remote-dds-trusted-identity.json" --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --out "identity\predeployment-identity.json"
      - name: Upload deployment identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env: { DDS_REMOTE_TEST_KEY: '' }
        with:
          name: 'remote-dds-identity-${{ github.run_id }}-${{ github.run_attempt }}'
          path: identity/predeployment-identity.json
          if-no-files-found: error
          retention-days: 7
      - name: Deploy and verify temporary Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
        run: |
          New-Item -ItemType Directory -Force deployment | Out-Null
          node scripts/prepare-remote-dds-deployment.mjs --deploy-from-identity "identity\predeployment-identity.json" --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --out "deployment\deployment.json"
      - name: Upload deployment record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env: { DDS_REMOTE_TEST_KEY: '' }
        with:
          name: 'remote-dds-deployment-${{ github.run_id }}-${{ github.run_attempt }}'
          path: deployment/deployment.json
          if-no-files-found: error
          retention-days: 7
      - name: Create state-0
        env: { DDS_REMOTE_TEST_KEY: '' }
        run: node scripts/remote-dds-ci-state.mjs --create-ready --trusted-identity "$env:RUNNER_TEMP\remote-dds-trusted-identity.json" --identity "identity\predeployment-identity.json" --deployment "deployment\deployment.json" --repository "${{ github.repository }}" --workflow "Remote DDS Soak" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --commit-sha "${{ github.sha }}" --out "state-0"
      - name: Upload state-0
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        env: { DDS_REMOTE_TEST_KEY: '' }
        with:
          name: 'remote-dds-state-${{ github.run_id }}-${{ github.run_attempt }}-0'
          path: state-0
          if-no-files-found: error
          retention-days: 7

  segment-1:
    needs: prepare
    if: "${{ needs.prepare.result == 'success' }}"
    runs-on: windows-2022
    timeout-minutes: 355
    steps:
      - { name: Check out repository, uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262, with: { submodules: recursive } }
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020

name: Windows DDS CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build native DDS baseline
        run: ./scripts/build-windows-dds.ps1
      - name: Smoke native DDS baseline
        run: npm run test:dds:smoke
      - name: Check command portability
        run: npm run test:commands
      - name: Run focused deployment and workflow tests
        run: node --test test/remote-dds-deployment-runner.test.js test/remote-dds-cleanup.test.js test/remote-dds-workflow-contract.test.js test/assert-remote-soak-prerequisites.test.js test/gitattributes-contract.test.js
